<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Perangkat Ajar IPA Fase D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2FA;--surface:#FFFFFF;--ink:#0E1A36;--muted:#4C5A7A;--line:#D5DDEE;
  --navy:#0A2463;--navy2:#1D4FC4;--gold:#F5B700;--chip:#E3EAFB;--chip-ink:#0A2463;
  --ok:#137A4B;--okbg:#DDF3E8;--bad:#B3261E;--badbg:#FBE3E1;--soft:#F5F8FF;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0A1226;--surface:#111C3A;--ink:#E8EDFB;--muted:#9FAED3;--line:#26376A;
    --chip:#1B2C59;--chip-ink:#DCE6FF;--ok:#66D19E;--okbg:#0F3324;--bad:#FF8A80;--badbg:#3B1614;--soft:#0E1731;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1226;--surface:#111C3A;--ink:#E8EDFB;--muted:#9FAED3;--line:#26376A;
  --chip:#1B2C59;--chip-ink:#DCE6FF;--ok:#66D19E;--okbg:#0F3324;--bad:#FF8A80;--badbg:#3B1614;--soft:#0E1731;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;line-height:1.55;font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:980px;margin:0 auto;padding:16px 16px 56px}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.seg{display:inline-flex;background:var(--chip);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:8px;font-weight:700;color:var(--chip-ink);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff}
.brand{font-weight:800;font-size:15px;color:var(--muted)}
.hero{padding:22px 0 20px}
.hero h1{font-size:clamp(28px,6vw,44px);line-height:1.08;margin:0 0 8px;font-weight:800;letter-spacing:-.02em}
.hero p{margin:0;color:var(--muted);max-width:56ch;font-size:16px}

/* menu cards, gaya seperti gambar acuan */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mc{display:flex;align-items:center;gap:12px;text-align:left;cursor:pointer;min-height:84px;padding:12px 14px;border-radius:8px;border:1px solid rgba(255,255,255,.14);color:#fff;
  background:radial-gradient(120% 160% at 50% 0%,#2A5FD6 0%,#12399B 45%,#0A2463 100%);box-shadow:0 1px 0 rgba(255,255,255,.12) inset,0 6px 14px -8px rgba(5,20,70,.6)}
.mc:hover{filter:brightness(1.08)}
.mc svg{flex:none}
.mc b{font-size:clamp(14px,3.6vw,18px);line-height:1.25;font-weight:700}
.grid .mc:last-child:nth-child(odd){grid-column:1/-1;justify-self:center;width:calc(50% - 6px)}

/* section pages */
.bar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.back{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:700;cursor:pointer}
h2.pt{margin:0;font-size:clamp(20px,4.5vw,28px);font-weight:800;letter-spacing:-.01em}
.lead{color:var(--muted);margin:2px 0 14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 16px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13.5px;cursor:pointer;font-weight:600}
.chip .sm{color:var(--muted);font-weight:600;margin-right:4px}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip.on .sm{color:#BFD0FF}
.tabs{display:flex;gap:6px;border-bottom:2px solid var(--line);margin:8px 0 14px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:9px 14px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.panel+.panel{margin-top:12px}
.doc h3{margin:18px 0 6px;font-size:16px;font-weight:800}
.doc h3:first-child{margin-top:0}
.doc ul,.doc ol{margin:4px 0 4px 20px;padding:0}
.doc li{margin:2px 0}
.kv{display:grid;grid-template-columns:150px 1fr;gap:4px 12px;margin:0 0 6px}
.kv dt{color:var(--muted);font-weight:600}.kv dd{margin:0}
.btn{border:0;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer;background:var(--navy);color:#fff}
.btn.alt{background:var(--chip);color:var(--chip-ink)}
.btn.warn{background:var(--badbg);color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tscroll{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{border:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
th{background:var(--soft);font-weight:700}
td.c,th.c{text-align:center}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px}
td input,td select{padding:5px 6px}
textarea{min-height:76px;resize:vertical}
label.f{display:block;font-weight:600;font-size:13px;margin:8px 0 3px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.note{font-size:13px;color:var(--muted);background:var(--soft);border:1px dashed var(--line);border-radius:8px;padding:9px 11px;margin:12px 0 0}
.prog{height:10px;border-radius:999px;background:var(--chip);overflow:hidden}
.prog i{display:block;height:100%;background:var(--gold)}
.chk{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.chk input{width:18px;height:18px;accent-color:var(--navy)}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:700;background:var(--chip);color:var(--chip-ink)}
.ok{color:var(--ok);font-weight:700}.bad{color:var(--bad);font-weight:700}
.q{padding:10px 0;border-bottom:1px solid var(--line)}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;margin:5px 0;cursor:pointer}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--badbg);border-color:var(--bad)}
.key{color:var(--ok);font-weight:700}
.week{width:26px;min-width:26px;padding:0;height:26px}
.fill{background:var(--navy2)}
.fillg{background:var(--gold)}

/* LKPD visual */
.lk{border-radius:14px;overflow:hidden;border:2px solid #1D4FC4;background:#fff;color:#0E1A36}
.lk-h{background:linear-gradient(135deg,#0A2463,#1D4FC4 60%,#3B82F6);color:#fff;padding:18px 18px 16px;position:relative}
.lk-h small{display:block;font-weight:700;color:#FFD966}
.lk-h h3{margin:2px 0 0;font-size:clamp(20px,5vw,28px);font-weight:800;line-height:1.15}
.lk-id{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 18px;background:#FFF6D6;font-size:13px;font-weight:600}
.lk-id span{border-bottom:1.5px dashed #9a7b00;padding-bottom:16px}
.lk-b{padding:14px 18px 18px}
.lk-s{margin:0 0 14px}
.lk-s h4{margin:0 0 6px;display:flex;align-items:center;gap:8px;font-size:15px;font-weight:800;color:#0A2463}
.lk-s h4 i{font-style:normal;background:#F5B700;border-radius:8px;width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center}
.bubble{background:#E8F0FF;border-left:5px solid #1D4FC4;border-radius:8px;padding:10px 12px;font-weight:600}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{background:#E8F0FF;color:#0A2463;border-radius:999px;padding:4px 12px;font-weight:600;font-size:13.5px}
.lk ol{margin:0 0 0 20px;padding:0}.lk li{margin:3px 0}
.lk table th{background:#DCE8FF;color:#0A2463;border-color:#9DB6EA}
.lk table td{border-color:#9DB6EA;height:30px}
.lk .line{border-bottom:1.5px dashed #90A4CF;height:24px}
.emo{display:flex;gap:18px;font-size:26px}
.map{display:flex;flex-direction:column;align-items:center;gap:0}
.map .root{background:var(--navy);color:#fff;border-radius:10px;padding:10px 18px;font-weight:800;text-align:center}
.map .stem{width:2px;height:16px;background:var(--gold)}
.map .kids{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;border-top:2px solid var(--gold);padding-top:14px;position:relative}
.map .kid{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:13.5px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:9px 16px;border-radius:999px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
.toast.show{opacity:1}
.hide{display:none!important}
@media (max-width:640px){
  .two{grid-template-columns:1fr}
  .kv{grid-template-columns:1fr}
  .lk-id{grid-template-columns:1fr}
  .map .kids{grid-template-columns:1fr}
  .mc{min-height:76px;padding:10px 11px;gap:9px}
  .mc svg{width:26px;height:26px}
}

/* akun, kop, tanda tangan */
.acct{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.link{border:0;background:transparent;color:var(--navy2);font-weight:700;cursor:pointer;padding:4px 6px;text-decoration:underline}
:root[data-theme="dark"] .link{color:#8FB2FF}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .link{color:#8FB2FF}}
.prev{background:#FFF1C2;color:#5A4300;border:1px solid #E9C55A;border-radius:8px;padding:8px 12px;margin:0 0 12px;font-weight:600;font-size:13.5px}
.kop{display:flex;align-items:center;gap:14px;padding:0 0 10px;margin:0 0 14px;border-bottom:4px double var(--ink)}
.kop img{width:64px;height:64px;object-fit:contain;flex:none}
.kop .kt{flex:1;text-align:center}
.kop .k1{font-size:13px;font-weight:600;letter-spacing:.02em}
.kop .k2{font-size:20px;font-weight:800;line-height:1.2}
.kop .k3{font-size:12.5px;color:var(--muted)}
.ttd{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:26px;font-size:14px;break-inside:avoid}
.ttd div{text-align:center}
.ttd .sp{height:64px}
.ttd b{text-decoration:underline}
@media (max-width:640px){.ttd{grid-template-columns:1fr}.kop img{width:48px;height:48px}.kop .k2{font-size:16px}}

/* cover perangkat */
.cvwrap{margin:0 0 16px}
.cover{width:726px;height:990px;position:relative;overflow:hidden;background:#fff;color:#0E1A36;border:3px solid var(--cv1);box-sizing:border-box;display:flex;flex-direction:column;margin:0 auto;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.cv-top{background:linear-gradient(160deg,var(--cv1) 0%,var(--cv2) 100%);color:#fff;padding:30px 40px 28px;text-align:center;position:relative;border-bottom:8px solid #F5B700}
.cv-ins{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin:0 0 12px;color:var(--cvt)}
.cv-logo{width:140px;height:140px;border-radius:50%;background:#fff;border:5px solid #F5B700;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;overflow:hidden;box-sizing:border-box}
.cv-logo img{width:100%;height:100%;object-fit:contain;padding:10px;box-sizing:border-box}
.cv-logo span{color:#9AA9CF;font-weight:700;font-size:14px}
.cv-kicker{letter-spacing:.3em;font-size:14px;font-weight:700;color:#FFD966}
.cv-title{font-size:46px;font-weight:800;line-height:1.08;margin:6px 0 2px}
.cv-sub{font-size:21px;font-weight:700}
.cv-body{flex:1;padding:24px 44px 8px;text-align:center}
.cv-pill{display:inline-block;background:#F5B700;color:#3B2B00;font-weight:800;font-size:22px;border-radius:999px;padding:6px 26px;letter-spacing:.04em}
.cv-sem{margin:12px 0 0;font-size:18px;font-weight:700;color:var(--cv1)}
.cv-kbc{margin:16px auto 0;max-width:560px;border:2px solid var(--cv1);border-radius:12px;padding:10px 14px;background:var(--cvl)}
.cv-kbc b{display:block;color:var(--cv1);font-size:15px}
.cv-kbc span{display:inline-block;margin:5px 3px 0;background:var(--cv1);color:#fff;border-radius:999px;padding:3px 11px;font-size:12.5px;font-weight:600}
.cv-list{margin:18px auto 0;max-width:580px;text-align:left;display:grid;grid-template-columns:1fr 1fr;gap:3px 26px;font-size:14px;line-height:1.5}
.cv-list div{padding-left:20px;position:relative}
.cv-list div:before{content:"\2713";position:absolute;left:0;color:#B98900;font-weight:800}
.cv-bot{background:var(--cv1);color:#fff;padding:18px 40px 22px;text-align:center;border-top:8px solid #F5B700}
.cv-year{font-size:14px;letter-spacing:.22em;color:#FFD966;font-weight:700}
.cv-yr{font-size:38px;font-weight:800;margin:0 0 8px}
.cv-by{font-size:14px;opacity:.92}
.cv-by b{display:block;font-size:17px;font-weight:700}
.cv-sch{margin-top:10px;border-top:1px solid rgba(255,255,255,.35);padding-top:8px;font-size:18px;font-weight:800}
.cv-addr{font-size:12.5px;opacity:.85;font-weight:400}
.cover{--cv1:#0B5D2E;--cv2:#2A9D57;--cvl:#EEF8F1;--cvt:#DDF3E5}
.cover.th-biru{--cv1:#0A2463;--cv2:#1D4FC4;--cvl:#F3F7FF;--cvt:#DCE6FF}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  body{background:#fff;color:#000}
  .noprint{display:none!important}
  .wrap{padding:0;max-width:none}
  .panel{border:0;padding:0}
  .lk{border-color:#000}
  .kop,.ttd{color:#000}
  .kop .k3{color:#333}
  .lk-h,.lk table th,.lk-id{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

/* banner teks berjalan + foto profil */
.runbar{background:var(--navy);color:var(--gold);overflow:hidden;white-space:nowrap;border-bottom:3px solid var(--gold);padding:9px 0}
.runbar span{display:inline-block;padding-left:100%;font-weight:700;font-size:15px;animation:runtxt 26s linear infinite}
@keyframes runtxt{from{transform:translateX(0)}to{transform:translateX(-100%)}}
@media (prefers-reduced-motion:reduce){.runbar span{animation:none;padding-left:16px}.runbar{white-space:normal}}
.prof{display:flex;justify-content:center;padding:18px 0 4px}
.prof img{width:140px;height:140px;border-radius:50%;object-fit:cover;border:5px solid var(--navy2);box-shadow:0 0 0 3px var(--gold),0 8px 18px -8px rgba(5,20,70,.6);background:#fff}
@media print{.runbar,.prof{display:none}}
</style>
</head>
<body>
<div class="runbar noprint" role="marquee" aria-label="Ucapan selamat datang"><span>Selamat Datang di Media Berbagi Oleh Epen Supendi, S.Pd. TENDIK MTs Pamuruyan Cibadak-Sukabumi JABAR</span></div>
<div class="wrap" id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ===================== DATA MATERI (usulan, silakan sesuaikan) ===================== */
function T(judul,sem,jp,tp,pemantik,alat,langkah,kolom,tanya,soal,konsep){return {judul,sem,jp,tp,pemantik,alat,langkah,kolom,tanya,soal,konsep};}
const D={
7:[
T('Hakikat IPA dan Pengukuran',1,20,
 ['menjelaskan langkah-langkah metode ilmiah dalam penyelidikan sederhana','menggunakan alat ukur panjang, massa, dan waktu dengan benar','menuliskan hasil pengukuran lengkap dengan satuan SI'],
 'Mengapa tinggi badan dua orang yang diukur dengan jengkal bisa berbeda, dan bagaimana ilmuwan menghindari perbedaan itu?',
 ['Penggaris 30 cm','Neraca atau timbangan dapur','Stopwatch (ponsel)','Benda kecil: buku, pensil, kelereng'],
 ['Perkirakan panjang buku tulismu dengan jengkal, lalu ukur dengan penggaris.','Ukur panjang benda yang sama sebanyak 3 kali dan catat hasilnya.','Timbang tiga benda berbeda lalu urutkan dari yang paling ringan.','Ukur waktu 10 ayunan bandul sederhana dengan stopwatch.'],
 ['Benda','Besaran','Hasil pengukuran','Satuan'],
 ['Mengapa satuan baku diperlukan dalam pengukuran?','Apa yang membuat hasil pengukuran berulang kalimu berbeda tipis?','Susun urutan metode ilmiah dari kegiatan yang baru kamu lakukan.'],
 [{q:'Satuan SI untuk massa adalah ...',o:['gram','kilogram','pon','ons'],k:1},{q:'Alat yang tepat untuk mengukur selang waktu adalah ...',o:['Termometer','Neraca','Stopwatch','Mistar'],k:2}],
 ['Metode ilmiah: merumuskan masalah, hipotesis, percobaan, analisis data, kesimpulan.','Besaran pokok antara lain panjang (m), massa (kg), waktu (s), suhu (K).','Pengukuran yang baik memakai alat sesuai, dibaca tegak lurus, dan diulang.']),
T('Klasifikasi Zat dan Perubahannya',1,25,
 ['membedakan unsur, senyawa, dan campuran berdasarkan contoh di sekitar','membedakan perubahan fisika dan perubahan kimia berdasarkan hasil pengamatan','memisahkan campuran sederhana dengan cara yang sesuai'],
 'Mengapa gula larut di air teh, tetapi pasir tidak? Apa yang terjadi saat kue dipanggang?',
 ['Gelas bening','Air','Garam, gula, pasir','Cuka dan soda kue','Kertas saring dan corong'],
 ['Larutkan garam, gula, dan pasir masing-masing dalam air lalu aduk.','Amati mana yang tercampur merata dan mana yang mengendap.','Campurkan sedikit soda kue dengan cuka; catat tanda-tanda perubahan yang terlihat.','Saring campuran air dan pasir memakai kertas saring.'],
 ['Zat atau campuran','Pengamatan','Jenis campuran/perubahan','Alasan'],
 ['Mana yang termasuk campuran homogen dan heterogen? Jelaskan.','Apa bukti bahwa cuka dan soda kue mengalami perubahan kimia?','Bagaimana kamu memisahkan campuran air dan pasir?'],
 [{q:'Air garam termasuk ...',o:['unsur','senyawa','campuran homogen','campuran heterogen'],k:2},{q:'Berikut yang merupakan perubahan kimia adalah ...',o:['es mencair','kertas dirobek','besi berkarat','gula larut'],k:2}],
 ['Zat murni terdiri atas unsur dan senyawa; campuran dapat homogen atau heterogen.','Perubahan fisika tidak menghasilkan zat baru; perubahan kimia menghasilkan zat baru.','Pemisahan campuran: penyaringan, penguapan, distilasi, kromatografi.']),
T('Suhu, Kalor, dan Pemuaian',1,25,
 ['menjelaskan hubungan suhu dan kalor','menjelaskan perpindahan kalor secara konduksi, konveksi, dan radiasi','menjelaskan peristiwa pemuaian dalam kehidupan sehari-hari'],
 'Mengapa sendok logam terasa lebih dingin daripada sendok plastik pada suhu ruang yang sama?',
 ['Termometer','Gelas berisi air panas dan air dingin','Sendok logam dan sendok plastik','Stopwatch'],
 ['Ukur suhu air panas dan air dingin sebelum dicampur.','Campurkan volume yang sama dan ukur suhu akhir setiap 1 menit selama 5 menit.','Masukkan sendok logam dan plastik ke air panas; rasakan bagian pegangan setiap menit.'],
 ['Waktu (menit)','Suhu campuran (°C)','Pegangan logam','Pegangan plastik'],
 ['Ke arah mana kalor berpindah pada percobaanmu?','Jenis perpindahan kalor apa yang terjadi pada sendok? Jelaskan.','Mengapa sambungan rel kereta api diberi celah?'],
 [{q:'Perpindahan kalor melalui zat padat tanpa disertai perpindahan partikel disebut ...',o:['konveksi','konduksi','radiasi','difusi'],k:1},{q:'Kalor berpindah dari benda bersuhu ... ke benda bersuhu ...',o:['rendah ke tinggi','tinggi ke rendah','sama ke sama','rendah ke rendah'],k:1}],
 ['Suhu menyatakan derajat panas benda; kalor adalah energi yang berpindah karena perbedaan suhu.','Kalor berpindah secara konduksi, konveksi, dan radiasi.','Zat umumnya memuai saat dipanaskan dan menyusut saat didinginkan.']),
T('Keanekaragaman Makhluk Hidup dan Klasifikasi',2,25,
 ['mengelompokkan makhluk hidup berdasarkan ciri-cirinya','menyusun kunci determinasi dikotomi sederhana','menjelaskan pentingnya keanekaragaman hayati'],

KBR('Hakikat IPA dan Pengukuran',[2,1],['pilar','sumber'],'Ukur panjang buku dengan jengkal lalu penggaris; rasakan bingungnya hasil yang berbeda-beda.','Bayangkan rumitnya jual beli dan pembangunan tanpa satuan baku; ilmu melahirkan keadilan.','Ukur dengan teliti dan catat data apa adanya, meski berbeda dari dugaan.','Bagikan hasil ukurmu dan saling mengoreksi dengan santun.','Bagaimana ketelitian dan kejujuran saat mengukur menunjukkan cintamu pada ilmu?','Mencatat data percobaan dengan jujur selama satu pekan.');
KBR('Klasifikasi Zat dan Perubahannya',[2,3],['sumber','sunnat'],'Amati dengan saksama zat yang larut, berbuih, atau berkarat; catat apa yang kamu rasakan.','Bayangkan dunia jika sifat zat tidak teratur: tidak ada masakan, obat, atau sabun yang bisa dibuat.','Lakukan praktikum dengan aman dan bersih, buang sisa larutan dengan bijak.','Jelaskan temuanmu kepada kelompok lain dengan bahasa yang mudah.','Keteraturan apa yang kamu temukan pada zat, dan apa yang kamu rasakan tentang Sang Pencipta?','Merapikan alat praktikum dan memakai bahan secukupnya.');
KBR('Suhu, Kalor, dan Pemuaian',[3,4],['hemat','sehat'],'Rasakan perbedaan suhu air dingin, hangat, dan panas pada telapak tangan (dengan aman).','Bayangkan energi panas yang terbuang saat memasak air tanpa menutup panci, dan cara menghematnya.','Uji penahan panas sederhana (botol berbalut kain) lalu bandingkan penurunan suhunya.','Bagikan tips hemat energi di rumah kepada teman dan keluarga.','Bagaimana berhemat energi menjadi tanda syukurmu dan wujud sayangmu pada bumi?','Menutup panci saat memanaskan air dan mematikan alat listrik yang tidak dipakai.');
KBR('Energi dan Sumber Energi',[3,5],['hemat','bangsa'],'Hitung berapa lampu dan kipas menyala di kelas saat tidak dipakai.','Bayangkan Indonesia yang kaya cahaya matahari, angin, dan panas bumi mengalirkan energi bersih untuk generasi mendatang.','Lakukan audit energi kelas dan buat poster ajakan hemat energi.','Pasang poster dan ajak kelas lain menjadi Petugas Energi.','Apa kontribusi kecilmu agar energi Indonesia cukup dan bersih untuk anak cucu?','Menjadi Petugas Energi kelas: mematikan lampu dan kipas saat kelas kosong.');
KBR('Keanekaragaman Makhluk Hidup dan Klasifikasi',[3,5,4],['adab','ragam','sumber'],'Jelajahi halaman sekolah dan hitung jenis daun yang kamu temukan; rasakan kagumnya.','Bayangkan jika hanya ada satu jenis tumbuhan; betapa miskinnya kehidupan. Indonesia kaya keanekaragaman hayati.','Susun kunci determinasi tanpa merusak atau mencabut tanaman.','Presentasikan kunci determinasimu dan hargai cara berpikir kelompok lain.','Apa yang bisa kamu pelajari tentang menghargai perbedaan dari beragamnya makhluk hidup?','Menyiram atau merawat satu tanaman di sekolah atau di rumah.');
KBR('Ekosistem dan Interaksi Makhluk Hidup',[3,1],['fasad','rahmat'],'Duduk tenang 15 menit di area pengamatan dan catat semua makhluk yang kamu lihat dan dengar.','Bayangkan jaring-jaring makanan yang terputus jika satu makhluk hilang.','Rancang aksi menjaga ekosistem sekolah: taman, pemilahan sampah, atau tempat minum burung.','Kampanyekan aksimu lewat poster atau video singkat.','Bagaimana menjaga makhluk kecil di sekitarmu menjadi wujud cinta kepada Allah?','Tidak menyakiti hewan dan tidak merusak tanaman di lingkungan sekolah.');
KBR('Bumi dan Tata Surya',[1,2],['sumber','syukur'],'Amati langit (pagi, siang, atau malam) dan rasakan betapa kecilnya dirimu di alam semesta.','Bayangkan keteraturan rotasi dan revolusi yang tidak pernah terlambat; ingat ayat tentang tanda-tanda di ufuk (QS. Fushshilat: 53).','Peragakan rotasi dan revolusi dengan model senter dan bola.','Jelaskan model buatanmu kepada adik kelas atau teman.','Apa yang kamu rasakan tentang Allah ketika memahami keteraturan tata surya?','Mengucap syukur saat melihat matahari terbit atau terbenam.');
KBR('Pencemaran Lingkungan',[3,4],['fasad','hemat'],'Timbang sampah kelasmu selama sehari dan rasakan jumlahnya.','Bayangkan ke mana sampah itu pergi: sungai, laut, atau tanah, dan siapa yang terkena dampaknya.','Pilah sampah dan rancang rencana pengurangan sampah kelas (3R).','Presentasikan rencana kepada wali kelas dan teman sekelas.','Siapa saja yang merasakan dampak sampah yang kita buang, dan bagaimana kamu bisa menyayangi mereka?','Membawa botol minum sendiri dan membuang sampah pada tempatnya.');
KBR('Gerak dan Gaya',[4,2],['sehat','pilar'],'Rasakan tubuh terdorong ke depan saat troli atau kursi beroda dihentikan mendadak (pelan dan aman).','Bayangkan naik kendaraan yang direm mendadak tanpa sabuk pengaman atau helm.','Ukur kecepatan benda bergerak dengan tekun dan teliti.','Buat poster keselamatan berkendara dan bagikan kepada keluarga.','Bagaimana memahami hukum gerak membantumu menjaga keselamatan dirimu dan orang yang kamu sayangi?','Mengingatkan keluarga memakai sabuk pengaman atau helm.');
KBR('Usaha dan Pesawat Sederhana',[4,2],['taawun','inov'],'Angkat beban berat dengan tangan kosong, lalu rasakan bedanya dengan bantuan tuas.','Bayangkan orang lanjut usia atau penyandang disabilitas yang kesulitan memindahkan barang.','Rancang alat bantu angkat dari tuas atau bidang miring.','Uji alatmu bersama teman dan perbaiki bersama-sama.','Bagaimana ilmu tentang pesawat sederhana bisa menjadi cara menolong sesama?','Membantu mengangkat atau memindahkan barang orang lain di rumah atau sekolah.');
KBR('Tekanan Zat dan Penerapannya',[2,4],['inov','sehat'],'Tekan spons dengan sisi balok yang lebar lalu sempit; rasakan dan amati bedanya.','Bayangkan bendungan dan tanggul yang dibuat lebih tebal di bagian bawah untuk melindungi warga.','Selidiki tekanan air pada kedalaman berbeda dengan botol berlubang.','Jelaskan hubungan tekanan dan keselamatan kepada teman.','Bagaimana ilmu tekanan melindungi banyak orang, dan apa tanggung jawabmu sebagai pemilik ilmu?','Berhati-hati pada benda tajam dan menjaga keselamatan teman saat praktikum.');
KBR('Getaran, Gelombang, dan Bunyi',[4,2],['tetangga','sehat'],'Dengarkan bunyi dari tiga sumber berbeda dengan mata terpejam; bedakan yang lembut dan yang nyaring.','Bayangkan tetangga yang sedang belajar atau beristirahat terganggu oleh suara yang terlalu keras.','Selidiki periode ayunan bandul dan sifat-sifat bunyi.','Susun kesepakatan kelas tentang suara yang sopan dan nyaman.','Bagaimana suara dan nada bicaramu memengaruhi perasaan orang lain?','Menurunkan volume suara dan memakai nada bicara lembut di kelas dan di rumah.');

function copyText(txt){

}

function printClone(){
  const c=document.getElementById('app').cloneNode(true);
  c.querySelectorAll('.noprint,script').forEach(x=>x.remove());
  c.querySelectorAll('[data-fit]').forEach(x=>{x.style.zoom='';});

}

async function exportHTML(){

  const html='<!DOCTYPE html><html lang="id" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>'+esc(TITLES[SEC])+' - IPA Fase D Kelas '+K+'</title><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet"><style>'+css+'</style></head><body><div class="wrap"><div class="noprint note" style="margin:0 0 14px">File siap cetak. Buka file ini di browser, tekan Ctrl+P (atau menu Cetak), lalu pilih Simpan sebagai PDF.</div>'+printClone().innerHTML+'</div></body></html>';
  try{await DL.save({filename:fileSlug()+'.html',data:html});toast('File siap cetak disimpan');}
  catch(e){if(!e||e.code!=='declined')toast('Gagal menyimpan file');}
}
async function exportPDF(){
  if(!DL){try{window.print();}catch(e){toast('Cetak tidak tersedia di tampilan ini.');}return;}
  toast('Menyiapkan PDF, mohon tunggu...',60000);
  let host=null;
  try{
    if(!window.jspdf)await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    if(!window.html2canvas)await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
    try{await document.fonts.ready;}catch(e){}
    const W=794,PH=1050;
    host=document.createElement('div');host.id='pdfhost';
    host.setAttribute('style','position:absolute;left:-12000px;top:0;width:'+W+'px;padding:28px 34px;background:#fff;color:#0E1A36;box-sizing:border-box;font-size:14px;line-height:1.5;font-family:\'Plus Jakarta Sans\',system-ui,sans-serif;'+LIGHT);
    host.appendChild(printClone());
    document.body.appendChild(host);
    const total=host.offsetHeight;
    const scale=Math.max(1,Math.min(2,Math.sqrt(16e6/(W*total))));
    const cv=await window.html2canvas(host,{scale:scale,backgroundColor:'#ffffff',windowWidth:W,logging:false,onclone:doc=>{const h=doc.getElementById('pdfhost');if(h){h.style.left='0px';h.style.top='0px';}}});
    const {jsPDF}=window.jspdf,pdf=new jsPDF({unit:'mm',format:'a4',orientation:'p'});
    const sliceH=Math.floor(PH*(cv.width/W)),pages=Math.min(60,Math.max(1,Math.ceil(cv.height/sliceH)));
    for(let i=0;i<pages;i++){
      const h=Math.min(sliceH,cv.height-i*sliceH),t=document.createElement('canvas');
      t.width=cv.width;t.height=h;
      const g=t.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,t.width,t.height);g.drawImage(cv,0,i*sliceH,cv.width,h,0,0,cv.width,h);
      if(i)pdf.addPage();
      pdf.addImage(t.toDataURL('image/jpeg',0.92),'JPEG',0,9.6,210,h/cv.width*210);
    }
    const blob=pdf.output('blob');
    await DL.save({filename:fileSlug()+'.pdf',data:blob});
    toast('PDF disimpan');
  }catch(e){
    if(e&&e.code==='declined'){toast('Penyimpanan dibatalkan');}
    else{toast('PDF gagal dibuat di sini. Mengunduh file siap cetak sebagai gantinya...',2500);await exportHTML();}
  }finally{if(host&&host.parentNode)host.parentNode.removeChild(host);}
}
function doPrint(){exportPDF();}

function hasilData(){
  const tl=topics();
  const head=['Nama'].concat(tl.map(t=>t.judul)).concat(['Rata-rata']);
  const rows=HASIL.map((h,i)=>{const r=(h.data&&h.data.r)||{};let sum=0,c=0;const cells=tl.map((t,j)=>{const x=r[K+'-'+j];if(!x||!x.n)return '-';const pc=Math.round(x.s/x.n*100);sum+=pc;c++;return x.s+'/'+x.n+' ('+pc+')';});return [NAMES[h.id]||('Siswa '+(i+1))].concat(cells).concat([c?Math.round(sum/c):'-']);});
  rows.sort((a,b)=>String(a[0]).localeCompare(String(b[0]),'id'));
  return {head,rows};
}

  else if(kind==='hadir'&&R){const ds=Object.keys(R.hadir||{});saveFile('kehadiran-'+R.nama+'.csv',toCSV([['Nama','Hadir','Sakit','Izin','Alpa','% hadir']].concat(R.siswa.map((n,i)=>{const c={H:0,S:0,I:0,A:0};ds.forEach(x=>{c[(R.hadir[x][i]||'H')]++;});return [n,c.H,c.S,c.I,c.A,ds.length?Math.round(c.H/ds.length*100):''];}))),true);}

function handleLogo(file){
  const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{const m=160,sc=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*sc));c.height=Math.max(1,Math.round(im.height*sc));c.getContext('2d').drawImage(im,0,0,c.width,c.height);S.set('logo',c.toDataURL('image/png'));toast('Logo disimpan');render(true);};im.onerror=()=>toast('File logo tidak dapat dibaca');im.src=r.result;};
  r.readAsDataURL(file);
}
function qscore(){const t=cur(),a=QANS[K+'-'+TI+'-l']||{};let sc=0,done=0;t.soal.forEach((q,i)=>{if(a[i]!=null){done++;if(a[i]===q.k)sc++;}});return {s:sc,n:t.soal.length,done};}
function qstatHTML(){

  return 'Skor: <b>'+q.s+' dari '+q.n+'</b> (nilai '+Math.round(q.s/q.n*100)+')'+(effRole()==='siswa'?' <button class="btn" data-act="kirim" style="margin-left:8px">Kirim nilai ke guru</button>':'');
}
async function kirimNilai(){
  const t=cur(),key=K+'-'+TI,q=qscore();
  if(q.done<q.n)return;
  if(PREVIEW){toast('Mode pratinjau: nilai tidak dikirim');return;}
  const rec={s:q.s,n:q.n,t:Date.now(),j:t.judul};
  try{
    if(DB&&ME&&ME.id){const ref=DB.doc('hasil/'+ME.id),snap=await ref.get(),r=snap.exists?Object.assign({},(snap.data().r||{})):{};r[key]=rec;await ref.set({r});MYRES=r;toast('Nilai terkirim ke guru');}
    else{const r=Object.assign({},S.get('myres',{}));r[key]=rec;S.set('myres',r);MYRES=r;toast('Tersimpan di perangkat ini (belum terhubung ke guru)');}
  }catch(e){toast(e&&e.code==='invalid_argument'?'Gagal kirim. Minta guru mengubah aksesmu menjadi Kontributor.':'Gagal mengirim, coba lagi.');}
}

async function init(){
  try{if(window.claude&&window.claude.use){U=await claude.use('user');DB=await claude.use('db');DL=await claude.use('downloads');}}catch(e){}
  try{
    if(U){
      ME=await U.me();const own=await U.isOwner(),ed=await U.canEdit();
      if(own||ed){ROLE='guru';AUTH='akun';}
      else if(ME&&ME.id){ROLE='siswa';AUTH='akun';}
    }
    if(AUTH==='lokal')ROLE=S.get('role','guru');
  }catch(e){ROLE=S.get('role','guru');}
  try{
    if(DB&&AUTH==='akun'&&ROLE==='guru'){DB.collection('hasil').onSnapshot(snap=>{HASIL=snap.docs.map(d=>({id:d.id,data:d.data()||{}}));resolveNames();if(SEC==='admin'&&TAB.admin==='hasil')render(true);},()=>{});}
    if(DB&&AUTH==='akun'&&ROLE==='siswa'&&ME&&ME.id){DB.doc('hasil/'+ME.id).onSnapshot(sn=>{MYRES=sn.exists?((sn.data()||{}).r||{}):{};if(SEC==='nilaisaya')render(true);},()=>{});}
  }catch(e){}
  const busy=document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if(!busy)render(true);
}

/* Perangkat ajar */
const ITEMS=['CP, ATP, Prota, Promes','Modul ajar / RPPM dan lampirannya','Bahan ajar','LKPD','Asesmen formatif dan sumatif','Rubrik penilaian','KKTP','Jurnal mengajar','Administrasi kelas'];
function modulHTML(t){
  return '<div class="doc" id="docOut"><h3>Modul Ajar IPA: '+esc(t.judul)+'</h3>'+ident(t)+
  '<h3>Tujuan pembelajaran</h3><p style="margin:0">Peserta didik mampu:</p><ul>'+li(t.tp)+'</ul>'+
  '<h3>Pertanyaan pemantik</h3><p style="margin:0">'+esc(t.pemantik)+'</p>'+
  '<h3>Alat dan bahan</h3><ul>'+li(t.alat)+'</ul>'+
  '<h3>Kegiatan pembelajaran</h3><p style="margin:0"><b>Pendahuluan (±10 menit)</b></p><ul><li>Salam, doa, dan cek kehadiran.</li><li>Sajikan pertanyaan pemantik dan minta peserta didik menuliskan dugaan awal.</li><li>Sampaikan tujuan pembelajaran dan alur kegiatan.</li></ul>'+
  '<p style="margin:8px 0 0"><b>Inti</b></p><ol>'+li(t.langkah)+'<li>Presentasikan hasil dan tanggapi hasil kelompok lain.</li></ol>'+
  '<p style="margin:8px 0 0"><b>Penutup (±10 menit)</b></p><ul><li>Simpulkan konsep bersama.</li><li>Refleksi: bagian mana yang paling sulit dan paling menarik?</li><li>Tiket keluar: jawab satu pertanyaan asesmen formatif.</li></ul>'+
  (KBCON()?kbcBlock(t,true):'')+'<h3>Asesmen</h3><ul><li>Formatif: observasi praktikum, LKPD, dan tiket keluar.</li><li>Sumatif: tes tertulis dan/atau laporan praktikum (rubrik keterampilan proses).</li>'+(KBCON()?'<li>Nilai cinta: observasi, refleksi diri, dan penilaian teman sejawat (rubrik Sikap Panca Cinta).</li>':'')+'</ul></div>';
}
const itemsNow=()=>ITEMS.concat(KBCON()?['Integrasi Panca Cinta (KBC)']:[]);
function vPerangkat(){
  const c=S.get('chk:'+K,{}),n=itemsNow().filter((_,i)=>c[i]).length,pct=Math.round(n/itemsNow().length*100),t=cur();
  return vShell('<p class="lead noprint">Pantau kelengkapan perangkat kelas '+K+' dan buat draf modul ajar per topik.</p>'+
  '<div class="panel noprint"><div class="row" style="justify-content:space-between"><b>Kelengkapan perangkat kelas '+K+'</b><span class="pill">'+n+' dari '+itemsNow().length+' siap</span></div><div class="prog" style="margin:10px 0"><i style="width:'+pct+'%"></i></div>'+
  itemsNow().map((x,i)=>'<label class="chk"><input type="checkbox" data-bind="chk" data-i="'+i+'" '+(c[i]?'checked':'')+'> '+esc(x)+'</label>').join('')+'</div>'+
  '<h3 class="noprint" style="margin:20px 0 0">Draf modul ajar</h3>'+picker()+tools('docOut')+'<div class="panel">'+modulHTML(t)+'</div>');
}

/* RPPM */
function vRPPM(){
  const t=cur();
  const doc='<div class="doc" id="docOut"><h3>Lampiran RPPM (Rencana Pembelajaran Mendalam): '+esc(t.judul)+'</h3>'+ident(t)+
  '<h3>Prinsip pembelajaran mendalam</h3><ul><li><b>Berkesadaran:</b> peserta didik tahu tujuan dan mengelola proses belajarnya sendiri.</li><li><b>Bermakna:</b> materi dikaitkan dengan pengalaman dan lingkungan nyata.</li><li><b>Menggembirakan:</b> suasana belajar aman, penuh rasa ingin tahu, dan mendorong kolaborasi.</li></ul>'+
  '<h3>Tujuan pembelajaran</h3><ul>'+li(t.tp)+'</ul>'+
  '<h3>Pengalaman belajar</h3>'+
  '<p style="margin:0"><b>1. Memahami</b></p><ul><li>Pertanyaan pemantik: '+esc(t.pemantik)+'</li><li>Konsep kunci:</li><li style="list-style:none"><ul>'+li(t.konsep)+'</ul></li></ul>'+
  '<p style="margin:8px 0 0"><b>2. Mengaplikasi</b></p><ol>'+li(t.langkah)+'</ol>'+
  '<p style="margin:8px 0 0"><b>3. Merefleksi</b></p><ul>'+li(t.tanya)+'</ul>'+
  (KBCON()?kbcBlock(t,false):'')+'<h3>Lampiran</h3><ol><li>Lampiran 1: LKPD "'+esc(t.judul)+'"</li><li>Lampiran 2: Bahan ajar dan peta konsep</li><li>Lampiran 3: Rubrik penilaian keterampilan proses</li><li>Lampiran 4: Instrumen asesmen formatif dan sumatif</li></ol></div>';
  return vShell('<p class="lead noprint">Kerangka rencana pembelajaran mendalam beserta daftar lampirannya, diisi otomatis dari topik yang dipilih. Sesuaikan formatnya dengan template sekolah.</p>'+picker()+
  tools('docOut','<button class="btn alt" data-act="open" data-s="lkpd">Ke LKPD</button><button class="btn alt" data-act="open" data-s="bahan">Ke Bahan Ajar</button><button class="btn alt" data-act="open" data-s="rubrik">Ke Rubrik</button>')+'<div class="panel">'+doc+'</div>');
}

/* CP ATP Prota Promes */
function vCPATP(){
  const tb=TAB.cpatp,c=cfg();
  const tabs=[['cp','CP'],['atp','ATP'],['prota','Prota'],['promes','Promes']];
  let body='';
  if(tb==='cp'){
    body='<div class="panel doc"><h3>Capaian Pembelajaran IPA Fase D (kelas 7–9)</h3><p style="margin:0 0 8px">Ringkasan dua elemen yang dikembangkan sepanjang fase:</p>'+
    '<p style="margin:8px 0 2px"><b>Elemen Pemahaman IPA</b></p><ul><li>Makhluk hidup dan lingkungannya: klasifikasi, ekosistem, sistem organ, pewarisan sifat, bioteknologi.</li><li>Zat, energi, dan gaya: klasifikasi dan perubahan zat, suhu dan kalor, gerak dan gaya, tekanan, getaran dan gelombang, cahaya, listrik dan magnet.</li><li>Bumi dan antariksa: tata surya, gerhana, perubahan iklim dan pemanasan global.</li></ul>'+
    '<p style="margin:8px 0 2px"><b>Elemen Keterampilan Proses</b></p><ul><li>Mengamati</li><li>Mempertanyakan dan memprediksi</li><li>Merencanakan dan melakukan penyelidikan</li><li>Memproses, menganalisis data dan informasi</li><li>Mengevaluasi dan refleksi</li><li>Mengomunikasikan hasil</li></ul>'+
    '<p class="note">Ini ringkasan bebas. Salin rumusan CP lengkap dari dokumen resmi Kemendikdasmen/BSKAP versi yang berlaku sebelum dimasukkan ke dokumen perangkat ajar.</p></div>'+(KBCON()?pemetaanKBC():'');
  }else if(tb==='atp'){
    body='<div class="panel"><div class="tscroll"><table id="atpT"><thead><tr><th>Sem</th><th>Topik</th><th>Tujuan pembelajaran</th><th class="c">JP</th>'+(KBCON()?'<th>Panca Cinta</th>':'')+'</tr></thead><tbody>'+
    topics().map((t,i)=>'<tr><td class="c">'+t.sem+'</td><td><b>'+esc(t.judul)+'</b></td><td><ol style="margin:0 0 0 16px;padding:0">'+li(t.tp.map(x=>x[0].toUpperCase()+x.slice(1)))+'</ol></td><td class="c">'+jpOf(i)+'</td>'+(KBCON()?'<td>'+esc(cintaTags(t).join(', '))+'</td>':'')+'</tr>').join('')+'</tbody></table></div></div>';
  }else if(tb==='prota'){
    const sm=[1,2].map(s=>({s,tot:semTopics(s).reduce((a,x)=>a+jpOf(x.i),0)}));
    const cap=c.mgg*c.jpw;
    body='<div class="panel"><div class="two noprint"><div><label class="f" for="cf1">Minggu efektif per semester</label><input id="cf1" type="number" min="1" max="26" value="'+c.mgg+'" data-bind="cfg" data-n="mgg"></div><div><label class="f" for="cf2">JP IPA per minggu</label><input id="cf2" type="number" min="1" max="10" value="'+c.jpw+'" data-bind="cfg" data-n="jpw"></div></div>'+
    '<div class="tscroll" style="margin-top:12px"><table><thead><tr><th>Sem</th><th>Topik</th><th class="c" style="width:90px">JP</th></tr></thead><tbody>'+
    [1,2].map(s=>semTopics(s).map(x=>'<tr><td class="c">'+s+'</td><td>'+esc(x.t.judul)+'</td><td class="c"><input type="number" min="0" style="width:70px" value="'+jpOf(x.i)+'" data-bind="jp" data-i="'+x.i+'" aria-label="JP '+esc(x.t.judul)+'"></td></tr>').join('')+
    '<tr><th colspan="2">Jumlah semester '+s+'</th><th class="c" id="tot'+s+'">'+sm[s-1].tot+'</th></tr>').join('')+'</tbody></table></div>'+
    '<p class="note" id="capNote">'+capNote(sm,cap)+'</p></div>';
  }else{
    const sels=[1,2].map(s=>{
      const list=semTopics(s),N=c.mgg,mon=s===1?['Juli','Agustus','September','Oktober','November','Desember']:['Januari','Februari','Maret','April','Mei','Juni'];
      let cum=0;
      const rows=list.map(x=>{const j=jpOf(x.i),a=cum/c.jpw,b=(cum+j)/c.jpw;cum+=j;return {n:x.t.judul,a:Math.floor(a+1e-9),b:Math.ceil(b-1e-9)-1};});
      const lastW=Math.ceil(cum/c.jpw-1e-9);
      let head1='<tr><th rowspan="2">Topik</th>',prev=0;
      mon.forEach((m,k)=>{const e=Math.round((k+1)*N/6),span=e-prev;prev=e;if(span>0)head1+='<th class="c" colspan="'+span+'">'+m+'</th>';});
      head1+='</tr><tr>'+Array.from({length:N},(_,w)=>'<th class="c week" style="font-size:11px">'+(w+1)+'</th>').join('')+'</tr>';
      const cell=(on,g)=>'<td class="week '+(on?(g?'fillg':'fill'):'')+'"></td>';
      const body=rows.map(r=>'<tr><td style="min-width:170px">'+esc(r.n)+'</td>'+Array.from({length:N},(_,w)=>cell(w>=r.a&&w<=r.b,false)).join('')+'</tr>').join('')+
      '<tr><td>Asesmen sumatif dan cadangan</td>'+Array.from({length:N},(_,w)=>cell(w>=lastW,true)).join('')+'</tr>';
      return '<h3 style="margin:14px 0 6px">Semester '+s+' ('+(s===1?'Ganjil':'Genap')+')</h3><div class="tscroll"><table style="font-size:12.5px"><thead>'+head1+'</thead><tbody>'+body+'</tbody></table></div>';
    }).join('');
    body='<div class="panel">'+sels+'<p class="note">Warna biru = minggu pelaksanaan topik, kuning = asesmen sumatif dan cadangan. Ubah JP di tab Prota dan minggu efektif akan mengikuti otomatis. Kurangi minggu efektif untuk libur dan kegiatan sekolah.</p></div>';
  }
  return vShell('<p class="lead noprint">Alur dan waktu belajar IPA kelas '+K+' selama setahun.</p><div class="tabs noprint" role="tablist">'+tabs.map(x=>'<button role="tab" data-act="tab" data-t="'+x[0]+'" aria-selected="'+(tb===x[0])+'">'+x[1]+'</button>').join('')+'</div>'+tools(null)+body);
}
function capNote(sm,cap){
  return sm.map(x=>'Semester '+x.s+': '+x.tot+' JP terpakai dari kapasitas '+cap+' JP ('+(cap-x.tot>=0?'<span class="ok">sisa '+(cap-x.tot)+' JP untuk asesmen dan cadangan</span>':'<span class="bad">kelebihan '+(x.tot-cap)+' JP, kurangi JP topik</span>')+').').join('<br>');
}

function avgOf(v){const a=['f','s','p'].map(k=>v[k]).filter(x=>x!==''&&x!=null&&!isNaN(x)).map(Number);return a.length?a.reduce((x,y)=>x+y,0)/a.length:null;}
const avgTxt=v=>{const a=avgOf(v);return a==null?'-':a.toFixed(1);};
const stTxt=(v,kk)=>{const a=avgOf(v);return a==null?'-':(a>=kk?'<span class="ok">Tercapai</span>':'<span class="bad">Perlu pendampingan</span>');};

function render(keepScroll){

  if(SEC==='setelan'&&effRole()!=='guru')SEC=null;
  if(SEC==='kbc'&&(!KBCON()||effRole()!=='guru'))SEC=null;

document.addEventListener('click',e=>{

  else if(a==='topic'){TI=Number(d.i);render(true);}

  else if(a==='atab'){TAB.admin=d.t;render(true);}

  else if(a==='key'){SHOWKEY=!SHOWKEY;render(true);}
  else if(a==='rub'){RUBI=Number(d.i);render(true);}

    const t=cur(),qi=Number(d.q),sq=t.soal[qi],o=Number(d.o),key=K+'-'+TI+'-'+d.ns;

    const sib=[...b.parentElement.querySelectorAll('.opt')];
    sib.forEach((x,i)=>{x.classList.remove('right','wrong');if(i===sq.k)x.classList.add('right');});
    if(o!==sq.k)b.classList.add('wrong');
    if(d.ns==='l'){const st=document.getElementById('qstat');if(st)st.innerHTML=qstatHTML();}
  }
  else if(a==='kirim'){kirimNilai();}
  else if(a==='ktab'){TAB.kbc=d.t;render(true);}
  else if(a==='ksem'){KSEM=Number(d.s);render(true);}

  }

    let v=el.value===''?'':Math.min(100,Math.max(0,Number(el.value)));R.nilai[d.i][d.k]=v;S.set('adm',A);
    const row=el.closest('tr'),n=R.nilai[d.i];row.querySelector('[data-avg]').textContent=avgTxt(n);row.querySelector('[data-st]').innerHTML=stTxt(n,cfg().kktp);
    if(v!=='')el.value=v;
  }
});
if(window.addEventListener)window.addEventListener('resize',()=>{if(SEC==='cover')fitCover();});
render();
init();
</script>
